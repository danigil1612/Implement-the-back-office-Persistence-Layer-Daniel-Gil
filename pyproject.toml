[project]
name = "treballdani-app"
version = "2.0.0"
description = "Formula 1 back-office TCP client and server"
authors = [{ name = "Dani" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "ipykernel>=6.0",
    "notebook>=7.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["client", "protocol"]

[tool.setuptools.packages.find]
where = ["src"]
